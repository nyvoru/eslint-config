version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Stockholm
    commit-message:
      prefix: build(deps)
    ignore:
      # Vue language tools and typed ESLint rules need the TypeScript 6 compiler API. Revisit with TypeScript 7.1.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      eslint:
        patterns:
          - eslint
          - '@antfu/eslint-config'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Stockholm
    commit-message:
      prefix: ci(deps)
